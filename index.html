<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>东西有道食材指南</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a settings column beside a results column; the five-color plate is laid out on the traditional 五方 cross (南 on top, 中 at center). */
:root{
  --paper:#EEF2EE; --surface:#FBFCFA; --ink:#1B2420; --muted:#5B6A62; --line:#D3DBD4; --accent:#2D6A55; --accent-soft:#DCEBE3;
  --qing:#3E8558; --chi:#B5432F; --huang:#C4922A; --bai:#ECE8DC; --hei:#2A2C38;
  --on-qing:#fff; --on-chi:#fff; --on-huang:#1B2420; --on-bai:#1B2420; --on-hei:#F1F1F4;
  --good:#2D6A55; --warn:#9A6A12; --off:#8B8F8C;
  --display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",Georgia,serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sci:#1F5F8B; --sci-bg:#E1ECF5; --trad:#8A4B1E; --trad-bg:#F5E7DA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111613; --surface:#18201C; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3832; --accent:#7EC3A7; --accent-soft:#1F3229;
  --qing:#4F9C6A; --chi:#C85A45; --huang:#D2A23C; --bai:#DCD8CC; --hei:#3B3E52;
  --on-qing:#fff; --on-chi:#fff; --on-huang:#151a17; --on-bai:#151a17; --on-hei:#F1F1F4;
  --good:#7EC3A7; --warn:#E0B355; --off:#6F7672; --sci:#9CC8EA; --sci-bg:#1C2D3B; --trad:#E9B98F; --trad-bg:#3A2A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111613; --surface:#18201C; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3832; --accent:#7EC3A7; --accent-soft:#1F3229;
  --qing:#4F9C6A; --chi:#C85A45; --huang:#D2A23C; --bai:#DCD8CC; --hei:#3B3E52;
  --on-qing:#fff; --on-chi:#fff; --on-huang:#151a17; --on-bai:#151a17; --on-hei:#F1F1F4;
  --good:#7EC3A7; --warn:#E0B355; --off:#6F7672; --sci:#9CC8EA; --sci-bg:#1C2D3B; --trad:#E9B98F; --trad-bg:#3A2A1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand small{display:block;font-size:12px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(26px,4.4vw,38px);line-height:1.2;margin:4px 0 0;text-wrap:balance}
.tagline{color:var(--muted);max-width:34em;margin:0;font-size:14px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:880px){.panel{position:static}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0;margin-bottom:8px;letter-spacing:.04em}
.hint{font-size:12px;color:var(--muted);margin:0}
select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label,.chip-in label{cursor:pointer}
.seg input,.chip-in input{position:absolute;opacity:0;pointer-events:none}
.seg span,.chip-in span{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--paper);transition:background .15s,border-color .15s}
.seg input:checked+span,.chip-in input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.seg input:focus-visible+span,.chip-in input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chip-in{display:flex;flex-wrap:wrap;gap:6px}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
main{display:grid;gap:28px;min-width:0}
.season{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.season .big{font-family:var(--display);font-size:44px;line-height:1;grid-row:span 2;color:var(--accent)}
.season .where{font-size:13px;color:var(--muted)}
.season .advice{margin:0;font-size:15px}
.season .advice b{font-weight:700}
h2{font-family:var(--display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sec-sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.plate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto;gap:8px;max-width:620px}
.cell{border-radius:10px;padding:10px 12px;min-height:118px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .dir{font-size:11px;letter-spacing:.12em;opacity:.85}
.cell .nm{font-family:var(--display);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.cell .why{font-size:12px;line-height:1.45;opacity:.92}
.cell .alt{font-size:11px;margin-top:auto;opacity:.8}
.cell.empty{border:1px dashed var(--line);background:transparent}
.cell.empty .corner{font-size:11px;color:var(--muted);margin:auto;text-align:center;line-height:1.5}
.c-青{background:var(--qing);color:var(--on-qing)} .c-赤{background:var(--chi);color:var(--on-chi)}
.c-黄{background:var(--huang);color:var(--on-huang)} .c-白{background:var(--bai);color:var(--on-bai)}
.c-黑{background:var(--hei);color:var(--on-hei)}
.cell.focus{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:440px){.cell{min-height:100px;padding:8px}.cell .nm{font-size:16px}.cell .why{font-size:11px}}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;align-items:baseline}
.tips li .k{font-weight:700;color:var(--accent);text-align:center}
.essentials{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ess{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.ess b{display:block;font-size:14px}
.ess span{font-size:13px;color:var(--muted)}
.ess .must{color:var(--chi);font-weight:700;font-size:12px}
.listbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.colorfilter{display:flex;gap:6px;flex-wrap:wrap}
.colorfilter button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.colorfilter button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.colorfilter button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.dot.c-青{background:var(--qing)}.dot.c-赤{background:var(--chi)}.dot.c-黄{background:var(--huang)}.dot.c-白{background:var(--bai)}.dot.c-黑{background:var(--hei)}
.foods{display:grid;gap:8px}
details.food{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.food summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px}
details.food summary::-webkit-details-marker{display:none}
details.food summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.sw{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-size:15px;grid-row:span 2}
.sw.c-白{border:1px solid var(--line)}
.fname{font-weight:700;font-size:16px;min-width:0}
.fname small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.rank{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.badges{display:flex;flex-wrap:wrap;gap:5px;grid-column:2/4;min-width:0}
.b{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.b.in{border-color:var(--good);color:var(--good);font-weight:700}
.b.all{color:var(--ink)}
.b.off{color:var(--off);border-style:dashed}
.b.imp{color:var(--warn);border-color:var(--warn)}
.b.nut{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.b.nut.sel{background:var(--accent);color:var(--surface);font-weight:700}
.b.org{color:var(--warn);border-color:var(--warn)}
.fbody{padding:0 14px 14px 56px;display:grid;gap:10px;font-size:14px}
@media (max-width:520px){.fbody{padding-left:14px}}
.ntable{overflow-x:auto}
.ntable table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:440px}
.ntable th,.ntable td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:right;white-space:nowrap}
.ntable th{font-weight:500;color:var(--muted)}
.ntable td.hit{font-weight:700;color:var(--good)}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.draft{font-size:11px;color:var(--warn)}
.more{font:inherit;justify-self:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
.more:focus-visible{outline:2px solid var(--accent)}
.empty-note{color:var(--muted);font-size:14px;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.head-r{display:grid;gap:10px;justify-items:end}
@media (max-width:640px){.head-r{justify-items:start}}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langsw button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:5px 14px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.langsw button:focus-visible,.small-btn:focus-visible,.ddb button:focus-visible,details summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[lang="en"] .cell .nm{font-size:18px}
:root[lang="en"] .brand small{letter-spacing:.06em}
:root[lang="en"] .kv{grid-template-columns:7.5em minmax(0,1fr)}
.quiz{border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.quiz summary{cursor:pointer;color:var(--accent);font-weight:500}
.quiz .qq{margin-top:10px}
.quiz .qq legend{font-weight:500;font-size:13px;letter-spacing:0;margin-bottom:6px}
.quiz-res{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.small-btn{font:inherit;font-size:13px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 12px;cursor:pointer}
.staple-pick{display:flex;gap:10px;align-items:center;margin-bottom:10px;max-width:620px}
.staple-pick label{font-weight:700;font-size:13px;white-space:nowrap}
.staple-pick select{max-width:280px}
.base{grid-column:1/-1;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.base.c-白{border:1px solid var(--line)}
.base .dir{font-size:11px;letter-spacing:.12em;opacity:.85}
.base .nm{font-family:var(--display);font-size:20px;line-height:1.3}
.base .nm small{font-family:var(--body);font-size:12px;opacity:.85;margin:0 4px}
.base .why{font-size:12px;opacity:.92}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:st;max-width:720px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;padding:10px 0;border-bottom:1px solid var(--line);counter-increment:st}
.steps li::before{content:counter(st);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps li b{font-size:14px}
.steps li span{font-size:15px}
.steps li small{color:var(--muted);font-size:12px}
.steps li.side::before{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.steps li.note{display:block;border:0;color:var(--muted);font-size:13px;counter-increment:none;padding-top:8px}
.steps li.note::before{content:none}
.tips li{grid-template-columns:auto minmax(0,1fr);gap:10px}
.evs{display:flex;gap:4px;flex-wrap:wrap;min-width:3.4em}
.ev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;line-height:1.6}
.ev.sci{background:var(--sci-bg);color:var(--sci)}
.ev.trad{background:var(--trad-bg);color:var(--trad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.spice-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.sp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.sp small{color:var(--muted)}
.sp span{font-size:13px;color:var(--muted)}
details.fold>summary{cursor:pointer;font-weight:500;color:var(--accent);padding:4px 0}
.h2like{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:700}
details.fold>summary.h2like{color:var(--ink)}
.spt{border-collapse:collapse;font-size:13px;min-width:680px}
.spt th,.spt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.spt th{color:var(--muted);font-weight:500}
.dd-count{font-size:13px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px;margin-bottom:10px}
.ddr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.ddl{min-width:0}
.ddl b{font-size:14px;display:block}
.ddl small{color:var(--muted);font-size:12px}
.ddb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ddb button{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--accent);background:transparent;cursor:pointer;padding:0}
.ddb button[aria-pressed="true"]{background:var(--accent)}
.reason{grid-column:2/4;font-size:12px;color:var(--muted);min-width:0}
.ntable td.rl{text-align:left;color:var(--muted);white-space:normal;min-width:9em}
.ntable td.hit2{font-weight:700;color:var(--good)}
.ntable tr.sub td{color:var(--muted);font-size:12px}
.layers{display:grid;gap:10px;margin:10px 0}
.layer{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.layer .ln{width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.layer p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.kv dd small{color:var(--muted)}
</style>
</head>
<body>


<div class="wrap">
<header>
  <div class="brand">
    <small data-t="brand"></small>
    <h1 data-t="h1"></h1>
  </div>
  <div class="head-r">
    <div class="langsw" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh" lang="zh-CN">中文</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <p class="tagline" data-t="tagline"></p>
  </div>
</header>

<div class="layout">
<form class="panel" id="form" autocomplete="off">
  <fieldset>
    <legend data-t="lgPlace"></legend>
    <select id="place" data-a="lgPlace"></select>
    <div class="seg" role="radiogroup" data-a="hemi">
      <label><input type="radio" name="hemi" id="hemi-N" value="N"><span data-t="hemiN"></span></label>
      <label><input type="radio" name="hemi" id="hemi-S" value="S"><span data-t="hemiS"></span></label>
    </div>
    <div class="seg" role="radiogroup" data-a="clim">
      <label><input type="radio" name="clim" id="clim-sub" value="sub"><span data-t="climsub"></span></label>
      <label><input type="radio" name="clim" id="clim-temp" value="temp"><span data-t="climtemp"></span></label>
      <label><input type="radio" name="clim" id="clim-cold" value="cold"><span data-t="climcold"></span></label>
    </div>
    <p class="hint" data-t="placeHint"></p>
  </fieldset>
  <fieldset>
    <legend data-t="lgMonth"></legend>
    <select id="month" data-a="lgMonth"></select>
  </fieldset>
  <fieldset>
    <legend data-t="lgTz"></legend>
    <div class="seg" role="radiogroup" data-a="lgTz">
      <label><input type="radio" name="tz" id="tz-cold" value="cold"><span data-t="tzcold"></span></label>
      <label><input type="radio" name="tz" id="tz-neutral" value="neutral"><span data-t="tzneutral"></span></label>
      <label><input type="radio" name="tz" id="tz-hot" value="hot"><span data-t="tzhot"></span></label>
    </div>
    <p class="hint" id="tz-hint"></p>
    <details class="quiz" id="quiz">
      <summary data-t="quizTitle"></summary>
      <div id="quiz-qs"></div>
      <div class="quiz-res"><span id="quiz-out"></span><button type="button" id="quiz-apply" class="small-btn"></button></div>
    </details>
  </fieldset>
  <fieldset>
    <legend data-t="lgNut"></legend>
    <div class="chip-in" id="nutrients"></div>
    <p class="hint" data-t="nutHint"></p>
  </fieldset>
  <label class="toggle"><input type="checkbox" id="showOff"> <span data-t="showOff"></span></label>
</form>

<main>
  <section class="season" aria-live="polite">
    <div class="big" id="s-big"></div>
    <div class="where" id="s-where"></div>
    <p class="advice" id="s-advice"></p>
  </section>

  <section>
    <h2 data-t="hPlate"></h2>
    <p class="sec-sub" data-t="plateSub"></p>
    <div class="staple-pick"><label for="staple" data-t="stapleLbl"></label><select id="staple"></select></div>
    <div class="plate" id="plate"></div>
  </section>

  <section>
    <h2 data-t="hTips"></h2>
    <p class="sec-sub legend"><span class="ev sci" data-t="evSci"></span> <span data-t="evSciD"></span> <span class="ev trad" data-t="evTrad"></span> <span data-t="evTradD"></span></p>
    <ul class="tips" id="tips"></ul>
  </section>

  <section>
    <h2 data-t="hSpice"></h2>
    <p class="sec-sub" id="spice-sub"></p>
    <div class="spice-picks" id="spice-picks"></div>
    <details class="fold">
      <summary data-t="spiceAll"></summary>
      <div class="ntable"><table class="spt" id="spice-table"></table></div>
    </details>
  </section>

  <section>
    <details class="fold dd" id="dd-wrap">
      <summary><span class="h2like" data-t="hDD"></span> <span class="dd-count" id="dd-count"></span></summary>
      <p class="sec-sub" data-t="ddSub"></p>
      <div class="dd-grid" id="dd"></div>
      <button type="button" class="small-btn" id="dd-reset" data-t="ddReset"></button>
    </details>
  </section>

  <section>
    <h2 data-t="hEss"></h2>
    <div class="essentials" id="ess"></div>
  </section>

  <section>
    <h2 data-t="hList"></h2>
    <p class="sec-sub" id="list-sub"></p>
    <div class="listbar">
      <input class="search" id="q" type="search">
      <div class="colorfilter" id="cf"></div>
    </div>
    <div class="foods" id="foods"></div>
  </section>

// ---------- logic ----------
const nEq = (m, hemi) => hemi === 'S' ? ((m + 5) % 12) + 1 : m;
const seasonOfN = mm => mm>=3&&mm<=5 ? '春' : mm>=6&&mm<=8 ? '夏' : mm>=9&&mm<=11 ? '秋' : '冬';
function nature(xw){
  if(!xw) return null;
  if(/生.*寒.*熟.*温/.test(xw)) return 'mixed';
  if(/微寒/.test(xw)) return 'cool';
  if(/寒/.test(xw)) return 'cold';
  if(/凉/.test(xw)) return 'cool';
  if(/热/.test(xw)) return 'hot';
  if(/温/.test(xw)) return 'warm';
  if(/平/.test(xw)) return 'neutral';
  return null;
}
function avail(f, st){
  if(/^全年/.test(f.fl)) return {s:'all', k: /栽培/.test(f.fl) ? 'grown' : 'stores'};
  const mm = nEq(st.month, st.hemi);
  if(/非本地/.test(f.fl) && st.clim === 'sub') return {s:'imp', k:'imported'};
  if(st.clim !== 'sub' && TROPICAL_ONLY.has(f.zh)) return {s:'imp', k:'notLocal'};
  if(st.clim === 'sub'){
    const ms = (f.fl.match(/\d+/g) || []).map(Number);
    if(ms.length) return ms.includes(mm) ? {s:'in', k:'in'} : {s:'off', k:'off'};
  }
  const seasons = [...f.trad].filter(c => '春夏秋冬'.includes(c));
  if(!seasons.length) return {s:'all', k:'all'};
  const sea = seasonOfN(mm);
  if(!seasons.includes(sea)) return {s:'off', k:'off'};
  if(st.clim === 'cold' && sea === '冬' && f.cat !== '根茎') return {s:'imp', k:'winterImp'};
  return {s:'in', k:'in'};
}
const pct = (f, k) => f.n[k] == null ? null : f.n[k] * f.serv.g / 100 / DV[k];
const ADJ = {cold:{cold:-3, cool:-1.5, warm:1.5, hot:1}, hot:{cold:0.5, cool:1.2, warm:-1.5, hot:-3}, neutral:{}};
function score(f, st, seaColor){
  let s = 0;
  const P = {}; NUTK.forEach(k => P[k] = pct(f, k));
  const hits = NUTK.filter(k => P[k] != null && P[k] >= 0.10).sort((a, b) => P[b] - P[a]);
  if(st.nutrients.length) st.nutrients.forEach(k => { if(P[k] != null) s += Math.min(P[k], 0.5) * 12; });
  else NUTK.forEach(k => { if(P[k] != null) s += Math.min(P[k], 0.4) * 6; });
  const a = avail(f, st);
  s += {in:3, all:1.2, imp:-1.5, off:-4}[a.s];
  const nat = nature(f.xw);
  const adj = ADJ[st.tz][nat] || 0;
  s += adj;
  if(f.whole === '完整') s += 0.8; else if(f.whole === '加工') s -= 1;
  const sc = f.color === seaColor;
  if(sc) s += 1;
  if(f.n.pro == null && f.n.fe == null) s -= 2;
  return {s, P, hits, a, nat, adj, sc};
}
function seasonInfo(st){
  const mm = nEq(st.month, st.hemi);
  const sea = seasonOfN(mm);
  const key = mm === 8 ? '长夏' : sea;
  return {key, color:SEASON_COLOR[key], terms:JIEQI.filter(j => j[0] === mm)};
}

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const en = () => state.lang === 'en';
const tx = (f, k) => en() ? f.e[k] : f[k];
const draftMark = s => esc(s).replace(L.draft, `<span class="draft">${L.draftLbl}</span>`);
const nm = f => en() ? f.en : f.zh;
const nameList = (arr, max = 2) => arr.slice(0, max).map(x => nm(x.f || x)).join(L.join);
const fmt = (v, k) => v == null ? '—' : (k === 'ca' || k === 'kcal' ? Math.round(v) : (+v).toFixed(1));
const pp = p => Math.round(p * 100);
const nutLower = n => en() && !/^(Omega|Vitamin)/.test(n) ? n.toLowerCase() : n;
function reasons(x){
  const out = [];
  const sel = x.hits.filter(k => state.nutrients.includes(k));
  (sel.length ? sel : x.hits).slice(0, 2).forEach(k => out.push(L.r.each(en() ? nutLower(L.nut[k]) : L.nut[k], pp(x.P[k]))));
  if(x.a.s === 'in' || x.a.s === 'all') out.push(L.avail[x.a.k]);
  if(x.adj > 0) out.push(L.r.fit);
  if(x.sc) out.push(L.r.seasonColor(L.color[x.f.color]));
  if(x.f.whole === '完整' && out.length < 4) out.push(L.r.whole);
  return out;
}

function applyLang(){
  L = T[state.lang];
  document.documentElement.lang = en() ? 'en' : 'zh-CN';
  document.title = L.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = L[el.dataset.t]; });
  document.querySelectorAll('[data-a]').forEach(el => el.setAttribute('aria-label', L[el.dataset.a]));
  document.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false'));
  $('place').innerHTML = PLACES.map(p => `<option value="${p.id}">${esc(p[state.lang])}</option>`).join('');
  $('month').innerHTML = Array.from({length:12}, (_, i) => `<option value="${i+1}">${L.month(i+1)}${i+1 === NOW.getMonth()+1 ? L.thisMonth : ''}</option>`).join('');
  $('nutrients').innerHTML = NUTK.map(k => `<label><input type="checkbox" id="nut-${k}" value="${k}"><span>${L.nut[k]}</span></label>`).join('');
  $('cf').innerHTML = `<button type="button" data-c="" aria-pressed="${!state.color}">${L.all}</button>` +
    COLORS.map(c => `<button type="button" data-c="${c}" aria-pressed="${state.color === c}"><i class="dot c-${c}"></i>${L.color[c]}</button>`).join('');
  $('ess').innerHTML = L.ess.map(([tag, t, d]) => `<div class="ess"><span class="must">${tag}</span><b>${t}</b><span>${d}</span></div>`).join('');
  $('layers').innerHTML = L.layers.map(([t, d], i) => `<div class="layer"><span class="ln">${i + 1}</span><div><b>${t}</b><p>${d}</p></div></div>`).join('');
  $('refs').textContent = L.refs;
  $('q').placeholder = L.search; $('q').setAttribute('aria-label', L.search);
  $('foot3').textContent = L.foot3(FOODS.length);
  $('quiz-qs').innerHTML = L.quiz.map(([q, opts], i) => `<fieldset class="qq"><legend>${i + 1}. ${q}</legend><div class="seg">${opts.map((o, j) =>
    `<label><input type="radio" name="qz${i}" id="qz${i}-${j}" value="${j - 1}"><span>${o}</span></label>`).join('')}</div></fieldset>`).join('');
  Object.entries(quiz).forEach(([i, v]) => { const el = $(`qz${i}-${v + 1}`); if(el) el.checked = true; });
  $('quiz-apply').textContent = L.quizApply;
  $('spice-table').innerHTML = `<thead><tr>${L.spTh.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>` + SPICES.map(s => `<tr>
    <td><b>${esc(en() ? s.en : s.zh)}</b><br><small>${esc(en() ? s.zh : s.en)}</small></td>
    <td>${draftMark(en() ? s.xw_en : s.xw)}</td><td>${draftMark(en() ? s.gj_en : s.gj)}</td><td>${draftMark(en() ? s.yj_en : s.yj)}</td>
    <td>${esc(en() ? s.use_en : s.use)}</td><td>${esc(en() ? s.sci_en : s.sci)}</td></tr>`).join('') + '</tbody>';
  try { history.replaceState(null, '', '#' + state.lang); } catch(e) {}
  updateQuiz();
}
function syncForm(){
  $('place').value = state.place;
  $('hemi-' + state.hemi).checked = true;
  $('clim-' + state.clim).checked = true;
  $('month').value = state.month;
  $('tz-' + state.tz).checked = true;
  NUTK.forEach(k => $('nut-' + k).checked = state.nutrients.includes(k));
  $('showOff').checked = state.showOff;
  $('tz-hint').textContent = L.tzHint[state.tz] + L.tzNote;
}
function quizResult(){
  if(Object.keys(quiz).length < 4) return null;
  const s = Object.values(quiz).reduce((a, b) => a + b, 0);
  return s <= -2 ? 'cold' : s >= 2 ? 'hot' : 'neutral';
}
function updateQuiz(){
  const r = quizResult();
  $('quiz-out').textContent = r ? L.quizOut(L['tz' + r]) : L.quizNeed;
  $('quiz-apply').hidden = !r || r === state.tz;
}

// ---------- render ----------
let plateItems = [];
function render(){
  const si = seasonInfo(state);
  const place = PLACES.find(p => p.id === state.place);
  $('s-big').textContent = si.key;
  $('s-where').textContent = (en() ? L.season[si.key] + ' · ' : '') +
    `${place && place.id !== 'custom' ? place[state.lang] + ' · ' : ''}${state.hemi === 'N' ? L.hemiN : L.hemiS} · ${L['clim' + state.clim]} · ${L.month(state.month)}` +
    (si.terms.length ? L.terms(si.terms.map(t => en() ? `${t[2]} ${t[1]}` : t[1])) + (state.hemi === 'S' ? L.sTerms : '') : '');
  $('s-advice').innerHTML = esc(L.seasonAdvice[si.key]) + L.favor(L.color[si.color], L.el[si.color], L.organ[si.color]);

  const scored = FOODS.map(f => ({f, ...score(f, state, si.color)})).sort((a, b) => b.s - a.s);
  const byZh = zh => scored.find(x => x.f.zh === zh);

  // staple + bean
  const stapleCands = scored.filter(x => (x.f.cat === '全谷' || ['红薯','山药'].includes(x.f.zh)) && x.a.s !== 'off');
  const sideOK = (x, c) => x.f.color === c && x.a.s !== 'off' && x.f.cat !== '全谷' && x.f.cat !== '坚果种子' && !(x.f.cat === '豆类' && x.f.stage === 1) && !NOT_IN_PLATE.has(x.f.zh);
  // five colors first: if no in-season yellow side dish, let a yellow grain fill the center
  const noYellow = !scored.some(x => sideOK(x, '黄'));
  const grains = stapleCands.filter(x => x.f.cat === '全谷');
  const autoStaple = (noYellow && grains.find(x => x.f.zh === YELLOW_FILL)) || grains[0] || stapleCands[0];
  const sel = $('staple');
  sel.innerHTML = `<option value="auto">${L.stapleAuto}${autoStaple ? (en() ? ': ' : '：') + esc(nm(autoStaple.f)) : ''}</option>` +
    stapleCands.map(x => `<option value="${esc(x.f.zh)}">${esc(nm(x.f))}</option>`).join('');
  if(state.staple !== 'auto' && !stapleCands.some(x => x.f.zh === state.staple)) state.staple = 'auto';
  sel.value = state.staple;
  const staple = state.staple === 'auto' ? autoStaple : byZh(state.staple);
  const bean = scored.find(x => x.f.cat === '豆类' && x.f.whole === '完整' && x.f.stage === 1 && x.f.zh !== '黄豆' && x.a.s !== 'off');
  const used = new Set([staple && staple.f.zh, bean && bean.f.zh]);

  const pick = {};
  COLORS.forEach(c => { pick[c] = scored.filter(x => sideOK(x, c) && !used.has(x.f.zh)).sort((a, b) => (a.f.cat === '水果') - (b.f.cat === '水果')).slice(0, 3); });
  const short = x => reasons(x).slice(0, 3).join(' · ');
  const cell = c => {
    const p = pick[c];
    const head = `<span class="dir">${L.dir[c]} · ${L.el[c]} · ${L.organ[c]}</span>`;
    if(!p.length){
      const fromBase = [staple, bean].filter(x => x && x.f.color === c && !COLOR_PENDING.has(x.f.zh));
      if(fromBase.length) return `<div class="cell c-${c}${c === si.color ? ' focus' : ''}">${head}<span class="nm">${fromBase.map(x => esc(nm(x.f))).join(L.sep)}</span><span class="why">${L.fromBase}</span></div>`;
      return `<div class="cell c-${c}">${head}<span class="nm">${L.none}</span><span class="why">${L.noneHint}</span></div>`;
    }
    const top = p[0];
    return `<div class="cell c-${c}${c === si.color ? ' focus' : ''}">${head}
      <span class="nm">${esc(nm(top.f))}</span><span class="why">${esc(short(top))}</span>
      ${p.length > 1 ? `<span class="alt">${L.alt}${p.slice(1).map(x => esc(nm(x.f))).join(L.sep)}</span>` : ''}</div>`;
  };
  const corner = '<div class="cell empty" aria-hidden="true"></div>';
  const base = staple ? `<div class="base c-${staple.f.color}"><span class="dir">${L.baseLbl}</span>
      <span class="nm">${esc(nm(staple.f))}${bean ? ` <small>${L.withBean}</small> ${esc(nm(bean.f))}` : ''}</span>
      <span class="why">${esc(short(staple))}</span></div>` : '';
  $('plate').innerHTML = corner + cell('赤') + corner + cell('青') + cell('黄') + cell('白') + corner + cell('黑') + corner + base;

  const seed = scored.find(x => x.f.cat === '坚果种子' && x.a.s !== 'off');
  const colorTops = COLORS.map(c => pick[c][0]).filter(Boolean);
  plateItems = [staple, bean, ...colorTops, seed].filter(Boolean);
  const fruit = scored.find(x => x.f.cat === '水果' && x.a.s !== 'off' && !colorTops.includes(x));
  const meal = [staple, bean, ...colorTops].filter(Boolean);
  if(fruit) plateItems.push(fruit);

  // tips
  const TP = L.tip, has = pred => plateItems.filter(pred);
  const tips = [];
  const feS = has(x => x.P.fe >= 0.10), vcS = has(x => x.P.vc >= 0.10);
  if(feS.length && vcS.length) tips.push(['sci', TP.feVc(nameList(feS), nameList(vcS))]);
  else if(feS.length) tips.push(['sci', TP.fe(nameList(feS))]);
  tips.push(['sci', staple && bean && staple.f.cat === '全谷' ? TP.grainLeg(nm(staple.f), nm(bean.f)) : TP.grain]);
  const beans = has(x => x.f.cat === '豆类' && x.f.whole === '完整');
  if(beans.length) tips.push(['both', TP.soak(nameList(beans)) + ' ' + TP.soakTrad]);
  const coldOnes = meal.filter(x => x.nat === 'cold' || x.nat === 'cool'), warmOnes = meal.filter(x => x.nat === 'warm' || x.nat === 'hot');
  if(state.tz === 'cold' && coldOnes.length) tips.push(['trad', TP.ginger(nameList(coldOnes))]);
  if(state.tz === 'hot' && warmOnes.length) tips.push(['trad', TP.cool(nameList(warmOnes))]);
  if(state.tz === 'neutral' && coldOnes.length && !warmOnes.length) tips.push(['trad', TP.bal(nameList(coldOnes))]);
  if(state.nutrients.includes('ca')) tips.push(['sci', TP.ca]);
  if(state.nutrients.includes('ala')) tips.push(['sci', TP.ala]);
  const fatSol = meal.filter(x => /胡萝卜素|维A|番茄红素/.test(x.f.hi));
  if(fatSol.length) tips.push(['sci', TP.oil(nameList(fatSol))]);
  if(seed){
    const selH = state.nutrients.filter(k => seed.hits.includes(k));
    const hl = (selH.length ? selH : seed.hits).slice(0, 3).map(k => nutLower(L.nut[k]));
    tips.push(['sci', TP.seed(nm(seed.f), hl.join(en() ? ', ' : '、'))]);
  }
  tips.push(['sci', TP.turmeric]);
  tips.push(['trad', TP.color]);
  tips.push(['trad', TP.flavor]);
  const evTag = t => t === 'both' ? `<span class="ev sci">${L.evSci}</span><span class="ev trad">${L.evTrad}</span>` : `<span class="ev ${t}">${t === 'sci' ? L.evSci : L.evTrad}</span>`;
  $('tips').innerHTML = tips.map(([t, s]) => `<li><span class="evs">${evTag(t)}</span><span>${esc(s)}</span></li>`).join('');

  // spices
  const sea = si.key;
  const warmNeed = state.tz === 'cold' || (state.tz === 'neutral' && (sea === '冬' || sea === '秋'));
  const coolNeed = state.tz === 'hot' || (state.tz === 'neutral' && (sea === '夏' || sea === '长夏'));
  const sp = ['姜黄','黑胡椒', ...(warmNeed ? ['肉桂','白胡椒','八角'] : coolNeed ? ['紫苏叶','陈皮'] : ['小茴香','陈皮'])];
  $('spice-sub').textContent = L.spiceSub(warmNeed ? L.spiceWhyCold : coolNeed ? L.spiceWhyHot : L.spiceWhyNeutral);
  $('spice-picks').innerHTML = sp.map(z => SPICES.find(s => s.zh === z)).map(s => `<div class="sp">
    <b>${esc(en() ? s.en : s.zh)}</b> <small>${esc(en() ? s.zh : s.en)} · ${L.nat[s.nat]}</small><span>${esc(en() ? s.use_en : s.use)}</span></div>`).join('');

  renderDD();

  // list
  const q = state.q.trim().toLowerCase();
  const list = scored.filter(x => (state.showOff || x.a.s !== 'off') && (!state.color || x.f.color === state.color) &&
    (!q || [x.f.zh, x.f.en, x.f.cat, x.f.e.cat, x.f.alias].some(s => (s || '').toLowerCase().includes(q))));
  const hidden = scored.filter(x => x.a.s === 'off').length;
  $('list-sub').textContent = L.listSub + (!state.showOff && hidden ? L.hidden(hidden) : '');
  const shown = state.expanded || q || state.color ? list : list.slice(0, 12);
  $('foods').innerHTML = shown.length ? shown.map((x, i) => foodCard(x, i)).join('') +
    (shown.length < list.length ? `<button type="button" class="more" id="more">${L.more(list.length)}</button>` : '')
    : `<div class="empty-note">${L.empty}</div>`;
  const m = $('more'); if(m) m.onclick = () => { state.expanded = true; render(); };
}

function renderDD(){
  const total = DDEF.reduce((a, d) => a + d.n, 0);
  const done = DDEF.reduce((a, d) => a + Math.min(dd[d.k] || 0, d.n), 0);
  $('dd-count').textContent = L.ddCount(done, total);
  $('dd').innerHTML = DDEF.map(d => {
    const inMeal = d.k === 'spices' ? (en() ? 'turmeric' : '姜黄') : plateItems.filter(x => d.m(x.f)).map(x => nm(x.f)).join(L.sep);
    const c = dd[d.k] || 0;
    return `<div class="ddr"><div class="ddl"><b>${L.dd[d.k]}</b>${inMeal ? `<small>${esc(inMeal)}</small>` : ''}</div>
      <div class="ddb">${Array.from({length:d.n}, (_, i) => `<button type="button" data-k="${d.k}" data-i="${i + 1}" aria-pressed="${i < c}" aria-label="${L.dd[d.k]} ${i + 1}"></button>`).join('')}</div></div>`;
  }).join('');
}

function foodCard(x, i){
  const f = x.f;
  const chips = x.hits.map(k => `<span class="b nut${state.nutrients.includes(k) ? ' sel' : ''}">${L.pctB(L.nut[k], pp(x.P[k]))}</span>`).join('');
  const rows = [['kcal','kcal'], ['pro','g'], ['fib','g'], ['ca','mg'], ['fe','mg'], ['zn','mg'], ['ala','g'], ['vc','mg']];
  const val = k => tx(f, k), ok = v => v && v !== '—';
  const g = f.serv.g, gj = val('gj');
  const serving = (en() ? f.serv.en : f.serv.zh) + (/\d\s?g|\d克/.test(en() ? f.serv.en : f.serv.zh) ? '' : `, ${g} ${en() ? 'g' : '克'}`);
  return `<details class="food">
    <summary>
      <span class="sw c-${f.color}">${f.color}</span>
      <span class="fname">${esc(nm(f))}<small>${esc(en() ? f.zh : f.en)}</small></span>
      <span class="rank">#${i + 1}</span>
      <span class="badges">
        <span class="b ${x.a.s}">${L.avail[x.a.k]}</span>
        ${x.nat ? `<span class="b">${L.natB(L.nat[x.nat])}</span>` : ''}
        ${chips}
        ${f.orgp === '高' ? `<span class="b org">${L.org}</span>` : ''}
      </span>
      <span class="reason">${L.why}${esc(reasons(x).join(' · '))}</span>
    </summary>
    <div class="fbody">
      <div class="ntable"><table>
        <thead><tr><th style="text-align:left"></th>${rows.map(r => `<th>${L.rows[r[0]]}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td class="rl">${esc(L.perS(serving))}</td>${rows.map(r => `<td>${f.n[r[0]] == null ? '—' : fmt(f.n[r[0]] * g / 100, r[0]) + ' ' + r[1]}</td>`).join('')}</tr>
          <tr><td class="rl">${L.dvRow}</td>${rows.map(r => { const p = DV[r[0]] ? x.P[r[0]] : null; return `<td class="${p != null && p >= 0.2 ? 'hit2' : p != null && p >= 0.1 ? 'hit' : ''}">${p == null ? '' : pp(p) + '%'}</td>`; }).join('')}</tr>
          <tr class="sub"><td class="rl">${esc(L.per100(en() ? f.e.basis : f.basis))}</td>${rows.map(r => `<td>${fmt(f.n[r[0]], r[0])}</td>`).join('')}</tr>
        </tbody>
      </table></div>
      <dl class="kv">
        ${f.alias ? `<dt>${L.dt.alias}</dt><dd>${esc(f.alias)}</dd>` : ''}
        ${ok(val('hi')) ? `<dt>${L.dt.hi}</dt><dd>${draftMark(val('hi'))}</dd>` : ''}
        ${ok(val('xw')) ? `<dt>${L.dt.xw}</dt><dd>${draftMark(val('xw'))}${ok(gj) ? draftMark(L.gj(gj)) : ''}</dd>` : ''}
        ${ok(val('yj')) ? `<dt>${L.dt.yj}</dt><dd>${draftMark(val('yj'))}</dd>` : ''}
        <dt>${L.dt.wx}</dt><dd>${L.wx(L.color[f.color], L.el[f.color], L.organ[f.color])}${COLOR_PENDING.has(f.zh) ? ` <span class="draft">${L.colorPending}</span>` : ''}</dd>
        <dt>${L.dt.qi}</dt><dd>${draftMark(L.qiTxt(L.qi[f.qi], L.whole[f.whole], val('qinote')))}</dd>
        <dt>${L.dt.prep}</dt><dd>${draftMark(val('prep'))}</dd>
        ${ok(val('caut')) ? `<dt>${L.dt.caut}</dt><dd>${draftMark(val('caut'))}</dd>` : ''}
        ${ok(val('orgn')) ? `<dt>${L.dt.orgn}</dt><dd>${draftMark(val('orgn'))}</dd>` : ''}
        ${ok(val('trad')) ? `<dt>${L.dt.trad}</dt><dd>${esc(L.tradTxt(val('trad')))}</dd>` : ''}
        <dt>${L.dt.src}</dt><dd><small>${esc(f.src)}</small></dd>
      </dl>
    </div>
  </details>`;
}

const form = $('form');
form.addEventListener('submit', e => e.preventDefault());
form.addEventListener('change', e => {
  const t = e.target;
  if(t.name && t.name.startsWith('qz')){ quiz[+t.name.slice(2)] = +t.value; updateQuiz(); return; }
  if(t.id === 'place'){
    state.place = t.value;
    const p = PLACES.find(p => p.id === t.value);
    if(p.hemi){ state.hemi = p.hemi; state.clim = p.clim; }
  } else if(t.name === 'hemi'){ state.hemi = t.value; state.place = 'custom'; }
  else if(t.name === 'clim'){ state.clim = t.value; state.place = 'custom'; }
  else if(t.id === 'month') state.month = +t.value;
  else if(t.name === 'tz') state.tz = t.value;
  else if(t.id.startsWith('nut-')) state.nutrients = NUTK.filter(k => $('nut-' + k).checked);
  else if(t.id === 'showOff') state.showOff = t.checked;
  state.expanded = false;
  syncForm(); updateQuiz(); save(); render();
});
$('quiz-apply').addEventListener('click', () => { const r = quizResult(); if(r){ state.tz = r; syncForm(); updateQuiz(); save(); render(); } });
$('staple').addEventListener('change', e => { state.staple = e.target.value; save(); render(); });
$('dd').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k, i = +b.dataset.i;
  dd[k] = (dd[k] || 0) === i ? i - 1 : i;
  saveDD(); renderDD();
});
$('dd-reset').addEventListener('click', () => { dd = {}; saveDD(); renderDD(); });
document.querySelector('.langsw').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.dataset.lang === state.lang) return;
  state.lang = b.dataset.lang; save(); applyLang(); syncForm(); render();
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if((h === 'en' || h === 'zh') && h !== state.lang){ state.lang = h; save(); applyLang(); syncForm(); render(); }
});
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('cf').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.color = b.dataset.c;
  $('cf').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
});
</script>

</body>
</html>
